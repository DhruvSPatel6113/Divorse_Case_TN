[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tamil-nadu-divorce-analysis"
version = "1.0.0"
description = "Analyzing Divorce Cases in Tamil Nadu: Judicial Trends, Demographic Patterns, Statistical Inference, and Predictive Analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "requests>=2.30.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "fastparquet>=2024.2.0",
    "pyarrow>=17.0.0,<18.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
